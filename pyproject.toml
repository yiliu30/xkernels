[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xkernels"
version = "0.1.0"
description = "JIT-compiled CUDA kernel library"
requires-python = ">=3.10"

[tool.setuptools.package-data]
xkernels.marlin = ["csrc/vllm_marlin/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
